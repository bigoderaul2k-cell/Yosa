<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yosa AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        /* Prose styling for clean light/dark AI chat look */
        .prose pre {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            position: relative;
            font-size: 0.85rem;
        }
        .prose code {
            color: #2563eb;
            background-color: rgba(37, 99, 235, 0.08);
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
        }
        .dark .prose code {
            color: #60a5fa;
            background-color: rgba(96, 165, 250, 0.15);
        }
        .prose pre code {
            color: inherit;
            background-color: transparent;
            padding: 0;
        }
        .cursor-blink::after {
            content: '┃';
            animation: blink 0.8s infinite;
            color: #2563eb;
            font-weight: bold;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex overflow-hidden transition-colors duration-200">

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-40 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0 md:static shadow-sm">
        <!-- Sidebar Header -->
        <div class="p-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-700 dark:text-slate-200">
                    <i class="fa-solid fa-sparkles text-sm text-blue-600 dark:text-blue-400"></i>
                </div>
                <span class="font-semibold text-slate-900 dark:text-white text-base">Yosa AI</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 p-2 rounded-lg">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- New Chat Button -->
        <div class="p-3">
            <button onclick="createNewChat()" class="w-full bg-slate-100 hover:bg-slate-200/80 dark:bg-slate-800 dark:hover:bg-slate-700/80 text-slate-700 dark:text-slate-200 font-medium py-2.5 px-3.5 rounded-2xl flex items-center justify-between transition-all text-sm">
                <span class="flex items-center gap-2">
                    <i class="fa-regular fa-pen-to-square text-xs"></i>
                    Nova conversa
                </span>
                <i class="fa-solid fa-plus text-xs opacity-60"></i>
            </button>
        </div>

        <!-- Chat History List -->
        <div class="flex-1 overflow-y-auto px-3 py-1 space-y-0.5" id="chat-history-list">
            <!-- Dynamically populated conversations -->
        </div>

        <!-- User Profile & Settings Footer -->
        <div class="p-3 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex flex-col space-y-2">
            <div id="user-profile-box" class="flex items-center justify-between p-1.5">
                <div class="flex items-center space-x-2.5 overflow-hidden">
                    <div id="user-avatar-container" class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 font-semibold text-xs overflow-hidden flex-shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="truncate">
                        <p class="text-xs font-medium text-slate-800 dark:text-slate-200 truncate" id="user-name-display">Visitante</p>
                        <p class="text-[10px] text-slate-400 truncate" id="user-email-display">Faça login para sincronizar</p>
                    </div>
                </div>
                <button onclick="showSettingsModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Configurações">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
            <div id="auth-action-container">
                <button onclick="loginWithGoogle()" id="google-login-btn" class="w-full py-2 px-3 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium flex items-center justify-center space-x-2 border border-slate-200 dark:border-slate-700 shadow-sm transition-colors">
                    <i class="fa-brands fa-google text-red-500"></i>
                    <span>Entrar com Google</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-white dark:bg-slate-950 relative overflow-hidden">
        <!-- Top Header -->
        <header class="h-14 border-b border-slate-100 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md px-4 flex items-center justify-between z-10">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-slate-800 dark:hover:text-white p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i class="fa-solid fa-bars text-base"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <h2 id="current-chat-title" class="font-medium text-slate-800 dark:text-slate-200 text-sm">Nova conversa</h2>
                </div>
            </div>
            <div class="flex items-center space-x-1">
                <button onclick="clearCurrentChat()" class="text-slate-400 hover:text-red-500 p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-900 transition-colors text-xs flex items-center gap-1.5" title="Limpar conversa">
                    <i class="fa-solid fa-trash-can"></i>
                    <span class="hidden sm:inline">Limpar</span>
                </button>
            </div>
        </header>

        <!-- Messages Area -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-3xl w-full mx-auto">
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center max-w-md mx-auto space-y-4 py-12">
                <div class="w-12 h-12 rounded-2xl bg-blue-50 dark:bg-slate-800 flex items-center justify-center text-blue-600 dark:text-blue-400 mb-1">
                    <i class="fa-solid fa-sparkles text-xl"></i>
                </div>
                <h3 class="text-xl font-semibold text-slate-800 dark:text-slate-100">Como posso ajudar hoje?</h3>
                <p class="text-slate-500 dark:text-slate-400 text-xs leading-relaxed">
                    Olá! Eu sou o Yosa. Posso ajudar você com respostas, tirar dúvidas, escrever códigos, criar conteúdos e conversar.
                </p>
                <div class="grid grid-cols-1 gap-2 w-full pt-4">
                    <button onclick="sendPresetPrompt('Crie um código HTML de um botão limpo e moderno')" class="p-3 bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-850 border border-slate-200/70 dark:border-slate-800 rounded-2xl text-left text-xs text-slate-700 dark:text-slate-300 transition-all flex items-center justify-between group">
                        <span>Gerar um código HTML/CSS limpo</span>
                        <i class="fa-solid fa-arrow-right text-slate-400 group-hover:translate-x-1 transition-transform text-[10px]"></i>
                    </button>
                    <button onclick="sendPresetPrompt('Explique de forma simples o que é inteligência artificial')" class="p-3 bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-850 border border-slate-200/70 dark:border-slate-800 rounded-2xl text-left text-xs text-slate-700 dark:text-slate-300 transition-all flex items-center justify-between group">
                        <span>Explicar inteligência artificial de forma simples</span>
                        <i class="fa-solid fa-arrow-right text-slate-400 group-hover:translate-x-1 transition-transform text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 md:p-4 bg-white dark:bg-slate-950">
            <div class="max-w-3xl mx-auto">
                <form id="chat-form" onsubmit="handleSendMessage(event)" class="relative flex items-center bg-slate-100 dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-3xl focus-within:border-slate-400 dark:focus-within:border-slate-600 transition-all px-3 py-1.5">
                    <textarea 
                        id="user-input" 
                        rows="1" 
                        placeholder="Responder ao Yosa..." 
                        class="w-full bg-transparent text-slate-800 dark:text-slate-100 placeholder-slate-400 text-sm py-2 px-2 focus:outline-none resize-none max-h-32"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResizeTextarea(this)"
                    ></textarea>
                    <div class="flex items-center space-x-1.5 ml-2">
                        <button type="submit" id="send-btn" class="w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center transition-all disabled:opacity-40 disabled:cursor-not-allowed flex-shrink-0 shadow-sm">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                    </div>
                </form>
                <div class="text-center mt-2">
                    <span class="text-[11px] text-slate-400">Yosa IA pode cometer erros. Voz integrada ativa.</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-xl relative">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-base font-semibold text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-600 dark:text-blue-400"></i> Configurações
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-4 text-xs text-slate-700 dark:text-slate-300">
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">Tema da Interface</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setTheme('light')" id="theme-btn-light" class="py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 font-medium flex items-center justify-center gap-2 transition-all">
                            <i class="fa-solid fa-sun text-amber-500"></i> Claro
                        </button>
                        <button onclick="setTheme('dark')" id="theme-btn-dark" class="py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 font-medium flex items-center justify-center gap-2 transition-all">
                            <i class="fa-solid fa-moon text-indigo-400"></i> Preto / Escuro
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-6">
                <button onclick="closeSettingsModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium rounded-xl transition-colors">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs and App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged, getRedirectResult } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUHIpl6Za7VnziaFdctX_JCsjwXmillUg",
            authDomain: "baseyosa-3c151.firebaseapp.com",
            projectId: "baseyosa-3c151",
            storageBucket: "baseyosa-3c151.firebasestorage.app",
            messagingSenderId: "1059651605950",
            appId: "1:1059651605950:web:4d29ca2a6ebad3df1b55ef",
            measurementId: "G-V9Y1FVPGTJ"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'baseyosa-default';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let currentChatId = null;
        let conversations = [];
        let messages = [];
        let isGenerating = false;
        
        // Fixed Embedded API Key
        const fixedApiKey = 'sk-ddCp3smkkgnlG23FMdrLc3VyGWNbZLfuQ6tgod4lheWmbMlO';

        // Global functions
        window.createNewChat = createNewChat;
        window.selectChat = selectChat;
        window.handleSendMessage = handleSendMessage;
        window.handleKeyDown = handleKeyDown;
        window.autoResizeTextarea = autoResizeTextarea;
        window.sendPresetPrompt = sendPresetPrompt;
        window.clearCurrentChat = clearCurrentChat;
        window.toggleSidebar = toggleSidebar;
        window.showSettingsModal = showSettingsModal;
        window.closeSettingsModal = closeSettingsModal;
        window.loginWithGoogle = loginWithGoogle;
        window.logoutUser = logoutUser;
        window.copyCode = copyCode;
        window.speakText = speakText;
        window.deleteChat = deleteChat;
        window.setTheme = setTheme;

        // Theme initialization
        let currentTheme = localStorage.getItem('yosa_theme') || 'light';
        applyTheme(currentTheme);

        function setTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('yosa_theme', theme);
            applyTheme(theme);
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-btn-dark')?.classList.add('bg-slate-800', 'border-blue-500', 'text-blue-400');
                document.getElementById('theme-btn-light')?.classList.remove('bg-slate-100', 'border-blue-500', 'text-blue-600');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-btn-light')?.classList.add('bg-slate-100', 'border-blue-500', 'text-blue-600');
                document.getElementById('theme-btn-dark')?.classList.remove('bg-slate-800', 'border-blue-500', 'text-blue-400');
            }
        }

        // Handle Redirect Result for Mobile Google Login
        getRedirectResult(auth).then((result) => {
            if (result && result.user) {
                currentUser = result.user;
                updateUserUI(currentUser);
            }
        }).catch((error) => {
            console.error("Redirect Auth Error:", error);
        });

        // Auth state listener
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            updateUserUI(user);
            if (user) {
                await loadConversations();
            } else {
                conversations = [];
                messages = [];
                renderConversationsList();
                renderMessages();
            }
        });

        async function loginWithGoogle() {
            try {
                // Try popup first
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.warn("Popup blocked or failed, falling back to redirect:", error);
                try {
                    // Fallback to redirect if popup fails/blanks in mobile browsers or iframes
                    await signInWithRedirect(auth, googleProvider);
                } catch (e) {
                    console.error("Google login error:", e);
                }
            }
        }

        async function logoutUser() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout error:", error);
            }
        }

        function updateUserUI(user) {
            const avatarContainer = document.getElementById('user-avatar-container');
            const nameDisplay = document.getElementById('user-name-display');
            const emailDisplay = document.getElementById('user-email-display');
            const authActionContainer = document.getElementById('auth-action-container');

            if (user) {
                if (user.photoURL) {
                    avatarContainer.innerHTML = `<img src="${user.photoURL}" alt="Avatar" class="w-full h-full object-cover rounded-full">`;
                } else {
                    avatarContainer.innerHTML = `<i class="fa-solid fa-user"></i>`;
                }
                nameDisplay.textContent = user.displayName || 'Usuário';
                emailDisplay.
